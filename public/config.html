<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configuration OneStock</title>
  <script src="i18n.js"></script>
  <style>
    :root { --bg: #f7f8fa; --card: #fff; --text: #1f2430; --muted: #6b7280; --border: #dfe2e7; --panel: #f3f4f6; --accent: #23a597; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 14px/1.45 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    label:first-of-type { margin-top: 0; }
    input { width: 100%; font: 13px ui-monospace, Menlo, Consolas, monospace; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; background: #fff; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row input { flex: 1; min-width: 0; }
    .hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
    .hint code, .state code { color: var(--text); }
    .state { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
    .source { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
    .source.site { background: #e6f6f4; color: #1c8d80; }
    .source.common { background: #e8f0fd; color: #2f62c9; }
    .source.default { background: #eef0f3; color: #4b5563; }
    .buttons { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
    button { font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 4px; border: 1px solid var(--border); background: #fff; color: var(--text); cursor: pointer; white-space: nowrap; }
    button:hover { background: var(--panel); }
    button.small { padding: 4px 10px; font-size: 13px; }
    button.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.accent:hover { background: #1c8d80; }
    .ok { color: #1f8a4c; font-size: 13px; }
    .notice { background: #fdf1e3; color: #8a4b08; border-radius: 4px; padding: 8px 12px; margin: 0 0 16px; font-size: 13px; }
    .notice[hidden] { display: none; }
    .logs-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .logs-head h2 { flex: 1; margin: 0; }
    .logs { border: 1px solid var(--border); border-radius: 6px; max-height: 520px; overflow: auto; }
    .log { border-bottom: 1px solid var(--panel); }
    .log:last-child { border-bottom: 0; }
    .log summary { display: flex; gap: 8px; align-items: center; padding: 8px 10px; cursor: pointer; list-style: none; font-size: 13px; }
    .log summary::-webkit-details-marker { display: none; }
    .log .time { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
    .log .site { flex: none; font-size: 12px; color: var(--muted); }
    .log .method { flex: none; font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .log .url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .log .status { flex: none; font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
    .status.ok { background: #e7f6ec; color: #1f8a4c; }
    .status.ko { background: #fdecea; color: #c0362c; }
    .log .dur { flex: none; color: var(--muted); font-size: 12px; min-width: 52px; text-align: right; }
    .log pre { margin: 0 10px 10px; background: #0f172a; color: #e2e8f0; padding: 8px 10px; border-radius: 4px; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto; }
    .log .label { margin: 4px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .empty { color: var(--muted); padding: 12px; }
    .diag { margin: 12px 0 0; background: #0f172a; color: #e2e8f0; padding: 10px 12px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 520px; overflow: auto; }
    select { font: inherit; padding: 7px 8px; border: 1px solid var(--border); border-radius: 4px; background: #fff; }
    .param { border-top: 1px solid var(--panel); padding-top: 12px; margin-top: 12px; }
    .param:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
    .param-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .param-head label { margin: 0; flex: 1; }
    .param-head select { font-size: 13px; padding: 4px 6px; }
    .meta { font-size: 13px; color: var(--muted); }
    .meta code { color: var(--text); }
    .grid { display: grid; grid-template-columns: 160px 1fr auto; gap: 8px; align-items: center; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { .log .time, .log .site { display: none; } .row { flex-wrap: wrap; } }
  </style>
</head>
<body>
<main>
  <h1 data-i18n="cfg.title">Configuration de l'extension OneStock</h1>
  <p class="sub" data-i18n="cfg.subtitle"></p>
  <p id="notice" class="notice" role="alert" hidden></p>

  <section class="card">
    <h2 data-i18n="cfg.access">Accès</h2>
    <form id="access-form" autocomplete="off">
      <label for="admin-key" data-i18n="cfg.admin_key">Clé d'administration</label>
      <input id="admin-key" type="password" spellcheck="false" placeholder="ADMIN_KEY">
      <div class="grid" style="margin-top: 12px">
        <select id="env" aria-label="Environment"></select>
        <input id="site-id" list="sites" spellcheck="false" aria-label="Site ID" data-i18n-placeholder="cfg.site_placeholder">
        <button class="accent" type="submit" data-i18n="cfg.load">Charger</button>
      </div>
      <datalist id="sites"></datalist>
      <p class="hint" data-i18n="cfg.common_hint"></p>
      <p class="meta" id="extension-meta"></p>
    </form>
  </section>

  <section class="card" id="settings-card" hidden>
    <h2 id="settings-title">Site</h2>
    <form id="settings-form" autocomplete="off">
      <div class="param" data-param="api_root">
        <div class="param-head">
          <label for="p-api_root"><span data-i18n="cfg.api_root"></span> <span class="source" data-source></span></label>
          <select data-scope aria-label="Scope"></select>
        </div>
        <input id="p-api_root" type="url" spellcheck="false">
        <p class="hint" id="hint-api_root"></p>
      </div>

      <div class="param" data-param="default_lang">
        <div class="param-head">
          <label for="p-default_lang"><span data-i18n="cfg.default_lang"></span> <span class="source" data-source></span></label>
          <select data-scope aria-label="Scope"></select>
        </div>
        <input id="p-default_lang" maxlength="2" spellcheck="false" style="max-width: 120px">
        <p class="hint" id="hint-default_lang"></p>
      </div>

      <div class="param" data-param="substitution_states">
        <div class="param-head">
          <label for="p-substitution_states"><span data-i18n="cfg.states"></span> <span class="source" data-source></span></label>
          <select data-scope aria-label="Scope"></select>
        </div>
        <input id="p-substitution_states" spellcheck="false" placeholder="fulfilled, claimed">
        <p class="hint" id="hint-substitution_states"></p>
      </div>

      <div class="param" data-param="substituted_state">
        <div class="param-head">
          <label for="p-substituted_state"><span data-i18n="cfg.substituted_state"></span> <span class="source" data-source></span></label>
          <select data-scope aria-label="Scope"></select>
        </div>
        <input id="p-substituted_state" spellcheck="false" placeholder="substituted" style="max-width: 320px">
        <p class="hint" data-i18n="cfg.substituted_state_hint"></p>
      </div>

      <div class="param" data-param="token">
        <div class="param-head">
          <label for="p-token"><span data-i18n="cfg.token"></span> <span class="source" data-source></span></label>
          <select data-scope aria-label="Scope"></select>
        </div>
        <p id="token-state" class="state"></p>
        <div class="row">
          <input id="p-token" type="password" spellcheck="false" data-i18n-placeholder="cfg.token_placeholder">
          <button id="toggle-token" type="button" data-i18n="cfg.show">Afficher</button>
        </div>
        <p class="hint" data-i18n="cfg.token_hint"></p>
      </div>

      <div class="buttons">
        <button class="accent" type="submit" data-i18n="cfg.save">Enregistrer</button>
        <button id="clear-token" type="button" data-i18n="cfg.clear_token">Supprimer le token du site</button>
        <span id="saved" class="ok" role="status"></span>
      </div>
    </form>
  </section>

  <section class="card" id="diag-card" hidden>
    <div class="logs-head">
      <h2 data-i18n="diag.title">Diagnostic</h2>
<input id="diag-order" spellcheck="false" style="max-width: 180px; font-size: 13px; padding: 4px 8px" data-i18n-placeholder="diag.order_placeholder">
            <button id="run-diag" class="small" type="button" data-i18n="diag.run">Lancer le diagnostic</button>
    </div>
    <p class="hint" data-i18n="diag.hint"></p>
    <pre id="diag" class="diag" hidden></pre>
  </section>

  <section class="card" id="logs-card" hidden>
    <div class="logs-head">
      <h2 id="logs-title" data-i18n="logs.title">Appels API OneStock</h2>
      <button id="refresh-logs" class="small" type="button" data-i18n="logs.refresh">Rafraîchir</button>
      <button id="clear-logs" class="small" type="button" data-i18n="logs.clear">Vider</button>
    </div>
    <div id="logs" class="logs"></div>
  </section>
</main>

<script>
  (function () {
    var KEY_STORAGE = "onestock_admin_key";
    var PARAMS = ["api_root", "default_lang", "substitution_states", "substituted_state", "token"];
    var VALUE_PARAMS = ["api_root", "default_lang", "substitution_states", "substituted_state"];
    var meta = null;
    var current = { env: "", site: "" };
    var lastCfg = null;
    var qs = new URLSearchParams(location.search);
    // Langue de la page : ?lang= (ex. lien depuis OneStock), sinon langue du navigateur
    var t = I18N.create(qs.get("lang") || navigator.language);
    document.title = t("cfg.title");
    t.apply();

    function $(id) { return document.getElementById(id); }
    function el(tag, className, text) {
      var n = document.createElement(tag);
      if (className) n.className = className;
      if (text !== undefined && text !== null) n.textContent = text;
      return n;
    }
    function storedKey() { try { return sessionStorage.getItem(KEY_STORAGE) || ""; } catch (e) { return ""; } }
    function storeKey(v) { try { sessionStorage.setItem(KEY_STORAGE, v); } catch (e) {} }
    function notice(msg) { $("notice").textContent = msg || ""; $("notice").hidden = !msg; }
    function paramBox(name) { return document.querySelector('.param[data-param="' + name + '"]'); }

    function api(url, payload) {
      return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Admin-Key": $("admin-key").value },
        body: JSON.stringify(payload)
      }).then(function (res) {
        return res.json().catch(function () { return { error: t("err.invalid_response", { status: res.status }) }; }).then(function (data) {
          if (!res.ok) throw new Error(t.error(data, t("err.http", { status: res.status })));
          return data;
        });
      });
    }

    // ---------- Métadonnées : extension, environnements, portées ----------

    function loadMeta() {
      return api("api/admin/config", { action: "meta" }).then(function (m) {
        meta = m;
        var sel = $("env");
        sel.innerHTML = "";
        m.environments.forEach(function (env) { var o = el("option", null, env); o.value = env; sel.appendChild(o); });
        sel.value = qs.get("env") && m.environments.indexOf(qs.get("env")) >= 0 ? qs.get("env") : m.default_env;
        $("extension-meta").textContent = t("cfg.extension", { id: m.extension_id });
        PARAMS.forEach(function (name) {
          var s = paramBox(name).querySelector("[data-scope]");
          s.innerHTML = "";
          [["global", t("cfg.scope.global")], ["extension", t("cfg.scope.extension", { id: m.extension_id })]].forEach(function (o) {
            var opt = el("option", null, o[1]); opt.value = o[0]; s.appendChild(opt);
          });
        });
      });
    }

    // ---------- Affichage d'un site ----------

    function showSource(name, f) {
      var n = paramBox(name).querySelector("[data-source]");
      if (!f || (!f.level && !f.set)) { n.className = "source"; n.textContent = ""; return; }
      var level = f.level || "site";
      n.className = "source " + (level === "default" ? "default" : level === "common" ? "common" : "site");
      n.textContent = level === "default" ? t("cfg.source.default")
        : t("cfg.origin", { scope: t("cfg.scope_short." + f.scope), level: t("cfg.level." + level) });
    }

    function showSettings(cfg) {
      lastCfg = cfg;
      $("settings-card").hidden = false;
      $("logs-card").hidden = false;
      $("diag-card").hidden = false;
      var where = (cfg.site_id ? t("cfg.site", { id: cfg.site_id }) : t("cfg.common")) + " — " + cfg.environment;
      $("settings-title").textContent = where;
      $("logs-title").textContent = t("logs.title") + " — " + (cfg.site_id ? t("cfg.site", { id: cfg.site_id }) : t("cfg.all_sites")) + " — " + cfg.environment;
      VALUE_PARAMS.forEach(function (name) {
        $("p-" + name).value = cfg[name].value;
        if (cfg.defaults[name]) $("p-" + name).placeholder = cfg.defaults[name];
        paramBox(name).querySelector("[data-scope]").value = cfg[name].scope;
        showSource(name, cfg[name]);
      });
      $("hint-api_root").textContent = t("cfg.api_root_hint", { "default": cfg.defaults.api_root });
      $("hint-default_lang").textContent = t("cfg.default_lang_hint", { "default": cfg.defaults.default_lang });
      $("hint-substitution_states").textContent = t("cfg.states_hint", { "default": cfg.defaults.substitution_states });
      paramBox("token").querySelector("[data-scope]").value = cfg.token.scope;
      showSource("token", cfg.token.set ? cfg.token : null);
      $("token-state").textContent = cfg.token.set
        ? t("cfg.token_set", { preview: cfg.token.preview }) + (cfg.token.updated_at ? t("cfg.token_updated", { date: new Date(cfg.token.updated_at).toLocaleString(t.lang) }) : "") +
          (cfg.token.decrypt_error ? " — " + t("err.token_decrypt_failed") : cfg.token.encrypted ? " — " + t("cfg.token_encrypted") : "")
        : t("cfg.token_none");
    }

    function loadSites() {
      return api("api/admin/config", { action: "sites", env: current.env }).then(function (data) {
        var dl = $("sites");
        dl.innerHTML = "";
        data.sites.forEach(function (s) { if (s.site_id) dl.appendChild(el("option", null, s.site_id)); });
      });
    }

    function load() {
      notice("");
      var ready = meta ? Promise.resolve() : loadMeta();
      return ready.then(function () {
        current = { env: $("env").value, site: $("site-id").value.trim() };
        return api("api/admin/config", { action: "get", env: current.env, site_id: current.site });
      }).then(function (cfg) { storeKey($("admin-key").value); showSettings(cfg); loadSites(); return loadLogs(); })
        .catch(function (e) { notice(e.message); });
    }

    function save(params, message) {
      return api("api/admin/config", { action: "set", env: current.env, site_id: current.site, params: params }).then(function (cfg) {
        showSettings(cfg);
        $("p-token").value = "";
        notice("");
        $("saved").textContent = message;
        setTimeout(function () { $("saved").textContent = ""; }, 2500);
        loadSites();
      }).catch(function (e) { notice(e.message); });
    }

    // ---------- Journal ----------

    function renderLogs(logs) {
      var box = $("logs");
      box.innerHTML = "";
      if (!logs.length) { box.appendChild(el("div", "empty", t("logs.none"))); return; }
      logs.forEach(function (log) {
        var d = el("details", "log");
        var s = el("summary");
        s.appendChild(el("span", "time", new Date(log.created_at).toLocaleString(t.lang)));
        if (!current.site) s.appendChild(el("span", "site", log.site_id || "—"));
        s.appendChild(el("span", "method", log.method));
        s.appendChild(el("span", "url", log.url));
        var ok = log.status >= 200 && log.status < 300;
        s.appendChild(el("span", "status " + (ok ? "ok" : "ko"), log.status ? String(log.status) : "ERR"));
        s.appendChild(el("span", "dur", log.duration_ms != null ? log.duration_ms + " ms" : ""));
        d.appendChild(s);
        if (log.error) { d.appendChild(el("div", "label", t("logs.error"))); d.appendChild(el("pre", null, log.error)); }
        d.appendChild(el("div", "label", t("logs.request")));
        d.appendChild(el("pre", null, JSON.stringify(log.request, null, 2)));
        if (log.response != null) {
          var resp = log.response;
          try { resp = JSON.stringify(JSON.parse(resp), null, 2); } catch (e) {}
          d.appendChild(el("div", "label", t("logs.response")));
          d.appendChild(el("pre", null, resp));
        }
        box.appendChild(d);
      });
    }

    function loadLogs() {
      return api("api/admin/logs", { action: "list", env: current.env, site_id: current.site, limit: 100 })
        .then(function (data) { renderLogs(data.logs); })
        .catch(function (e) { $("logs").innerHTML = ""; $("logs").appendChild(el("div", "empty", t("error.prefix", { error: e.message }))); });
    }

    // ---------- Événements ----------

    $("access-form").addEventListener("submit", function (e) { e.preventDefault(); load(); });
    $("env").addEventListener("change", function () { if (lastCfg) load(); });
    $("settings-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var params = {};
      VALUE_PARAMS.forEach(function (name) {
        params[name] = { value: $("p-" + name).value.trim(), scope: paramBox(name).querySelector("[data-scope]").value };
      });
      var token = $("p-token").value.trim();
      var tokenScope = paramBox("token").querySelector("[data-scope]").value;
      // Token : enregistré s'il est saisi ; un changement de portée seul réécrit le token actuel n'est pas possible
      // (il n'est jamais renvoyé au navigateur) : il faut le ressaisir.
      if (token) params.token = { value: token, scope: tokenScope };
      save(params, t("cfg.saved"));
    });
    $("clear-token").addEventListener("click", function () {
      var scope = lastCfg && lastCfg.token.set ? lastCfg.token.scope : paramBox("token").querySelector("[data-scope]").value;
      save({ token: { value: "", scope: scope } }, t("cfg.token_cleared"));
    });
    $("toggle-token").addEventListener("click", function () {
      var input = $("p-token");
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      this.textContent = show ? t("cfg.hide") : t("cfg.show");
    });
    $("run-diag").addEventListener("click", function () {
      var box = $("diag");
      box.hidden = false;
      box.textContent = "…";
      api("api/admin/config", { action: "diagnostic", env: current.env, site_id: current.site, order_id: $("diag-order").value.trim() || undefined })
        .then(function (d) { box.textContent = JSON.stringify(d, null, 2); if (lastCfg) load(); })
        .catch(function (e) { box.textContent = t("error.prefix", { error: e.message }); });
    });
    $("refresh-logs").addEventListener("click", loadLogs);
    $("clear-logs").addEventListener("click", function () {
      if (!confirm(current.site ? t("logs.confirm_site", { id: current.site }) : t("logs.confirm_all"))) return;
      api("api/admin/logs", { action: "clear", env: current.env, site_id: current.site }).then(function (d) { renderLogs(d.logs); }).catch(function (e) { notice(e.message); });
    });

    // Pré-remplissage : clé de la session, ?env= et ?site_id=
    $("admin-key").value = storedKey();
    if (qs.get("site_id")) $("site-id").value = qs.get("site_id");
    if ($("admin-key").value || qs.get("site_id")) load();
  })();
</script>
</body>
</html>
