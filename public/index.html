<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Substitution</title>
  <script src="i18n.js"></script>
  <style>
    :root {
      --bg: #ffffff; --text: #1f2430; --muted: #6b7280; --border: #dfe2e7; --panel: #f3f4f6;
      --thumb: #e5e7eb; --error: #b42318; --error-bg: #fef3f2; --accent: #23a597;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.4 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .order { border: 1px solid var(--border); border-radius: 6px; padding: 4px; margin-bottom: 16px; }
    .order-header { display: flex; gap: 12px; align-items: flex-start; background: var(--panel); border-radius: 6px; padding: 12px 16px; }
    .order-header svg { flex: none; margin-top: 2px; color: #4b5563; }
    .order-title { font-size: 15px; font-weight: 600; }
    .order-sub { color: #4b5563; font-size: 13px; margin-top: 2px; word-break: break-word; }
    .order.error .order-header { background: var(--error-bg); color: var(--error); }
    .order.error .order-header svg, .order.error .order-sub { color: var(--error); }
    .item { display: flex; align-items: center; gap: 12px; padding: 12px; }
    .order .item + .item { border-top: 1px solid var(--panel); }
    .thumb { flex: none; width: 48px; height: 48px; border-radius: 4px; background: var(--thumb); object-fit: cover; display: flex; align-items: center; justify-content: center; color: #9ca3af; }
    .info { flex: 1; min-width: 0; }
    .name { font-size: 15px; font-weight: 600; }
    .details { font-size: 15px; }
    .sku { color: var(--muted); font-size: 13px; }
    .name, .details, .sku { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { flex: none; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #eef0f3; color: #4b5563; }
    .badge.teal { background: #e6f6f4; color: #23a597; }
    .badge.green { background: #e7f6ec; color: #1f8a4c; }
    .badge.orange { background: #fdf1e3; color: #b8650b; }
    .badge.red { background: #fdecea; color: #c0362c; }
    .badge.blue { background: #e8f0fd; color: #2f62c9; }
    .qty { flex: none; font-size: 15px; min-width: 48px; text-align: right; }
    .empty { color: var(--muted); padding: 12px; }
    .footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .footer .spacer { flex: 1; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.accent:hover:not(:disabled) { background: #1c8d80; }

    /* Parcours en étapes */
    .stepper { position: relative; display: flex; justify-content: space-between; margin: 4px 8px 20px; }
    .stepper::before { content: ""; position: absolute; top: 13px; left: 14px; right: 14px; height: 2px; background: var(--border); }
    .step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); min-width: 60px; }
    .step:first-child { align-items: flex-start; }
    .step:last-child { align-items: flex-end; }
    .step .circle { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); background: #fff; display: flex; align-items: center; justify-content: center; }
    .step.active { color: var(--text); font-weight: 600; }
    .step.active .circle { border-color: var(--accent); }
    .step.active .circle::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    .step.done .circle { border-color: var(--accent); background: var(--accent); }
    .step.done .circle::after { content: "✓"; color: #fff; font-size: 14px; font-weight: 700; }
    .info-banner { display: flex; gap: 12px; align-items: center; background: var(--panel); border-radius: 6px; padding: 12px 16px; margin-bottom: 12px; color: #374151; }
    .info-banner svg { flex: none; }
    .info-banner.success { background: #e7f6ec; color: #1f6b3d; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .card { border: 1px solid var(--border); border-radius: 6px; background: #fff; }
    .card.selectable { cursor: pointer; }
    .card.selectable:hover { border-color: #9fd9d1; }
    .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .check { flex: none; width: 22px; height: 22px; border: 2px solid #c4c9d2; border-radius: 4px; display: flex; align-items: center; justify-content: center; background: #fff; }
    .card.selected .check { background: var(--accent); border-color: var(--accent); }
    .card.selected .check::after { content: "✓"; color: #fff; font-size: 14px; font-weight: 700; }
    .check.radio { border-radius: 50%; }
    .card.disabled { background: var(--panel); }
    .card.disabled .item { opacity: .55; }
    .card .reason { font-size: 12px; color: var(--muted); padding: 0 12px 10px 72px; margin-top: -6px; }
    .card.selected .check.radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
    .group-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: 16px 0 8px; text-transform: uppercase; letter-spacing: .03em; }
    .subst { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
    .subst .original { background: var(--panel); border-radius: 6px; }
    .subst .label { font-size: 13px; font-weight: 600; margin: 12px 0 8px; }
    .subst .note { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
    .search { display: flex; gap: 8px; margin: 12px 0 8px; }
    .search input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; }
    .recap { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 12px; }
    .recap .arrow { color: var(--accent); font-size: 18px; font-weight: 700; padding-left: 28px; line-height: 1; }
    .recap .item { padding: 8px; }
    .recap .card { min-width: 0; }
    button { font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 4px; border: 1px solid var(--border); background: #fff; color: var(--text); cursor: pointer; }
    button:hover { background: var(--panel); }
    button.small { padding: 4px 10px; font-size: 13px; }
    button.primary { background: var(--text); border-color: var(--text); color: #fff; }
    button.primary:hover { background: #374151; }
    .loading { color: var(--muted); padding: 24px 0; text-align: center; }
    @media (max-width: 480px) {
      .item { flex-wrap: wrap; }
      .info { flex-basis: calc(100% - 60px); }
      .badge { margin-left: 60px; }
    }
  </style>
</head>
<body>
  <div id="panel-items">
    <div class="stepper" id="stepper">
      <div class="step" data-step="0"><span class="circle"></span><span data-i18n="step.items">Articles</span></div>
      <div class="step" data-step="1"><span class="circle"></span><span data-i18n="step.substitution">Substitution</span></div>
      <div class="step" data-step="2"><span class="circle"></span><span data-i18n="step.validation">Validation</span></div>
    </div>
    <div id="orders"><div class="loading" data-i18n="loading.items">Chargement des articles…</div></div>
  </div>

  <div class="footer">
    <button id="back" type="button" hidden data-i18n="btn.back">Retour</button>
    <span class="spacer"></span>
    <button id="close" type="button" data-i18n="btn.close">Fermer</button>
    <button id="next" class="accent" type="button" hidden data-i18n="btn.next">Suivant</button>
  </div>

  <template id="icon-info"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></template>
  <template id="icon-i"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></template>
  <template id="icon-box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></template>

  <script>
    (function () {
      // Noms des features produit configurées sur le site OneStock
      // (comparaison insensible à la casse, espaces et "_" : "Image URL" = "image_url" = "imageUrl")
      // Une liste = plusieurs noms possibles, le premier renseigné est utilisé
      var FEATURES = {
        name: "name", image: ["image", "Image URL"], color: "color", size: "size", price: "price",
        // Articles de substitution (identifiants d'articles) sur la fiche article
        substitution: ["substitution", "substitutions", "sustitution"]
      };
      var SEARCH_LIMIT = 10;
      // Langue de repli pour les fiches articles (langue par défaut du site, configurée dans /config.html)
      var FALLBACK_LANG = "fr";
      // Statuts de ligne permettant la substitution (paramètre du site) ; "*" = tous
      var SUBSTITUTION_STATES = ["*"];
      // Fiches articles (via le proxy générique) ; les commandes passent par le proxy dédié /api/orders/{id}
      var ITEMS_API = "/v2/items";

      var params = new URLSearchParams(window.location.search);
      var lang = (params.get("lang") || navigator.language || "en").slice(0, 2);
      var locale = (params.get("locale") || params.get("lang") || navigator.language || "en").replace("_", "-");
      // Traductions de la page dans la langue du contexte
      var t = I18N.create(params.get("lang") || params.get("locale") || navigator.language);
      document.title = t("title.popup");
      t.apply();
      var allowedOrigin = null;
      try { if (params.get("parent_url")) allowedOrigin = new URL(params.get("parent_url")).origin; } catch (e) {}

      var shared = {};      // données onestock_data
      var orderIds = [];

      // ---------- Appels serveur ----------

      // Contexte de l'extension, vérifié par le serveur (signature)
      function context() {
        return {
          extension_id: params.get("extension_id"),
          user_id: params.get("user_id"),
          extension_signature: shared.extension_signature,
          site_id: params.get("site_id"),
          // Environnement OneStock (qualif, prod…) : paramètre "env" de l'URL de l'extension, sinon défaut du serveur
          env: params.get("env") || params.get("environment") || undefined
        };
      }

      function handleResponse(res) {
        return res.json().catch(function () { return { error: t("err.invalid_response", { status: res.status }) }; }).then(function (data) {
          if (!res.ok) throw Object.assign(new Error(t.error(data, t("err.http", { status: res.status }))), { auth: !!data.auth_error || res.status === 401 });
          return data;
        });
      }

      function post(url, payload) {
        return fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.assign(context(), payload))
        }).then(handleResponse);
      }

      function get(url, query) {
        var qs = new URLSearchParams();
        var all = Object.assign(context(), query);
        Object.keys(all).forEach(function (k) { if (all[k] !== undefined && all[k] !== null) qs.set(k, all[k]); });
        return fetch(url + "?" + qs.toString()).then(handleResponse);
      }

      // Contrôle du statut renvoyé par OneStock à travers le proxy
      function checkOneStock(path) {
        return function (r) {
          if (r.status === 401) throw Object.assign(new Error(t("err.onestock_401")), { auth: true });
          if (r.status < 200 || r.status >= 300) {
            var msg = r.data && (r.data.message || r.data.error || r.data.raw);
            throw new Error(t("err.onestock", { path: path, status: r.status, message: msg ? (typeof msg === "string" ? msg : JSON.stringify(msg)) : "" }).trim());
          }
          return r.data;
        };
      }

      // Appel d'une API OneStock via le proxy générique (token + site_id ajoutés côté serveur)
      function onestock(path, body) {
        return post("api/proxy", { method: "GET", path: path, body: body }).then(checkOneStock(path));
      }

      // GET order via le proxy Vercel dédié
      function getOrder(id) {
        return get("api/orders/" + encodeURIComponent(id), { lang: lang }).then(checkOneStock("/v3/orders/" + id));
      }

      // ---------- Récupération des articles ----------

      function first(v) { return Array.isArray(v) ? v[0] : v; }

      // Fiches articles (GET /v2/items) -> { item_id: { langue: features } }
      // Sans "lang" ni "features", l'API renvoie les features de toutes les langues.
      function fetchItemSheets(itemIds) {
        var ids = itemIds.filter(function (id, i) { return id && itemIds.indexOf(id) === i; });
        if (!ids.length) return Promise.resolve({});
        return onestock(ITEMS_API, {
          item_ids: ids,
          get_total: false,
          pagination: { start: 0, limit: ids.length }
        }).then(function (data) {
          var sheets = {};
          ((data && data.items) || []).forEach(function (item) { sheets[item.id] = item.features || {}; });
          return sheets;
        });
      }

      function normalizeKey(k) { return String(k).toLowerCase().replace(/[^a-z0-9]/g, ""); }

      // Valeur d'une feature dans un objet { nom: [valeurs] }, nom comparé sans casse ni séparateurs
      function featureIn(features, name) {
        if (Array.isArray(name)) {
          for (var n = 0; n < name.length; n++) {
            var found = featureIn(features, name[n]);
            if (found) return found;
          }
          return null;
        }
        var wanted = normalizeKey(name);
        var keys = Object.keys(features || {});
        for (var i = 0; i < keys.length; i++) {
          if (normalizeKey(keys[i]) === wanted) {
            var v = first(features[keys[i]]);
            if (v !== undefined && v !== null && v !== "") return v;
          }
        }
        return null;
      }

      // Feature de la fiche article : langue du contexte, sinon langue de repli (fr), sinon première langue
      function sheetFeature(byLang, name) {
        if (!byLang) return null;
        var v = featureIn(byLang[lang], name) || featureIn(byLang[FALLBACK_LANG], name);
        if (v) return v;
        var langs = Object.keys(byLang);
        for (var i = 0; i < langs.length; i++) { v = featureIn(byLang[langs[i]], name); if (v) return v; }
        return null;
      }

      // Toutes les valeurs d'une feature (liste), langue du contexte puis fr puis toutes les langues
      function sheetValues(byLang, names) {
        names = Array.isArray(names) ? names : [names];
        var langs = [lang, FALLBACK_LANG].concat(Object.keys(byLang || {}));
        for (var l = 0; l < langs.length; l++) {
          var features = (byLang || {})[langs[l]] || {};
          var keys = Object.keys(features);
          for (var n = 0; n < names.length; n++) {
            for (var i = 0; i < keys.length; i++) {
              if (normalizeKey(keys[i]) !== normalizeKey(names[n])) continue;
              var raw = features[keys[i]];
              var values = (Array.isArray(raw) ? raw : [raw]).reduce(function (acc, v) {
                return acc.concat(String(v == null ? "" : v).split(/[,;\n]+/));
              }, []).map(function (v) { return v.trim(); }).filter(Boolean);
              if (values.length) return values;
            }
          }
        }
        return [];
      }

      // Article affichable à partir d'une fiche article (substitution / recherche)
      function sheetToItem(id, byLang, currency) {
        var price = sheetFeature(byLang, FEATURES.price);
        return {
          item_id: id,
          name: sheetFeature(byLang, FEATURES.name) || id,
          image: sheetFeature(byLang, FEATURES.image),
          color: sheetFeature(byLang, FEATURES.color),
          size: sheetFeature(byLang, FEATURES.size),
          unit_price: price != null && !isNaN(parseFloat(price)) ? parseFloat(price) : null,
          currency: currency
        };
      }

      // Une ligne par line_item_group (quantité + état), prix de l'order_item, image de la fiche article
      function toItems(order, sheets) {
        var orderItems = order.order_items || [];
        var byId = {};
        orderItems.forEach(function (oi) { byId[oi.id || oi._id] = oi; });
        var groups = (order.line_item_groups && order.line_item_groups.length) ? order.line_item_groups
          : orderItems.map(function (oi) { return Object.assign({}, oi, { order_item_id: oi.id || oi._id, state: null }); });

        return groups.map(function (g, index) {
          var oi = byId[g.order_item_id] || orderItems.filter(function (o) { return o.item_id === g.item_id; })[0] || {};
          var sheet = sheets[g.item_id];
          var features = Object.assign({}, (oi.item && oi.item.features) || {}, (g.item && g.item.features) || {});
          var pricing = oi.pricing_details || {};
          function value(name) { return featureIn(features, name) || sheetFeature(sheet, name); }
          return {
            key: (order.id || "") + "|" + (g.id || index),
            order_id: order.id,
            line_item_group_id: g.id,
            substitutes: sheetValues(sheet, FEATURES.substitution).filter(function (id) { return id !== g.item_id; }),
            item_id: g.item_id,
            name: value(FEATURES.name) || g.item_id,
            image: sheetFeature(sheet, FEATURES.image),
            color: value(FEATURES.color),
            size: value(FEATURES.size),
            unit_price: pricing.unit_price,
            currency: pricing.currency,
            quantity: g.quantity,
            state: g.state
          };
        });
      }

      function loadOrder(id) {
        return getOrder(id)
          .then(function (order) {
            var ids = (order.line_item_groups || []).concat(order.order_items || []).map(function (x) { return x.item_id; });
            // Une fiche article indisponible n'empêche pas d'afficher la commande
            return fetchItemSheets(ids).catch(function () { return {}; }).then(function (sheets) {
              return { id: order.id || id, types: order.types || [], state: order.state, items: toItems(order, sheets) };
            });
          })
          .catch(function (e) { return { id: id, error: e.message, auth: e.auth }; });
      }

      function loadItems() {
        document.getElementById("orders").innerHTML = "";
        document.getElementById("orders").appendChild(el("div", "loading", t("loading.items")));
        if (!orderIds.length) {
          wizard = { step: 0, orders: [{ id: "", error: t("order.missing") }], selected: {}, replacements: {}, candidates: {}, results: {} };
          render();
          return;
        }
        Promise.all(orderIds.map(loadOrder)).then(function (orders) {
          wizard = { step: 0, orders: orders, selected: {}, replacements: {}, candidates: {}, results: {}, validated: false };
          render();

        });
      }

      // ---------- Rendu des articles ----------

      var STATE_COLORS = {
        claimed: "teal", fulfilled: "green", collected: "green", delivered: "green", dispatched: "green", picked: "green", packed: "green",
        pending: "orange", unassigned: "orange", assigned: "blue", reserved: "blue",
        removed: "red", unfulfilled: "red", canceled: "red", cancelled: "red", declined: "red", returned: "red"
      };

      function el(tag, className, text) {
        var n = document.createElement(tag);
        if (className) n.className = className;
        if (text !== undefined && text !== null) n.textContent = text;
        return n;
      }
      function icon(id) { return document.getElementById(id).content.firstElementChild.cloneNode(true); }
      function placeholder() { var ph = el("div", "thumb"); ph.appendChild(icon("icon-box")); return ph; }

      function formatPrice(amount, currency) {
        if (amount === null || amount === undefined) return null;
        try { return new Intl.NumberFormat(locale, { style: "currency", currency: currency || "EUR" }).format(amount); }
        catch (e) { return amount + (currency ? " " + currency : ""); }
      }

      function thumb(item) {
        if (!item.image) return placeholder();
        var img = el("img", "thumb");
        img.src = item.image; img.alt = item.name || ""; img.loading = "lazy";
        img.onerror = function () { img.replaceWith(placeholder()); };
        return img;
      }

      // Ligne article : image, nom, prix | couleur | taille, référence ; options : badge, qty, case
      function renderItem(item, opts) {
        opts = opts || {};
        var row = el("div", "item");
        row.appendChild(thumb(item));
        var info = el("div", "info");
        info.appendChild(el("div", "name", item.name));
        var details = [formatPrice(item.unit_price, item.currency), item.color, item.size].filter(Boolean).join(" | ");
        if (details) info.appendChild(el("div", "details", details));
        info.appendChild(el("div", "sku", item.item_id));
        row.appendChild(info);
        if (opts.badge !== false && item.state) row.appendChild(el("span", "badge " + (STATE_COLORS[item.state] || ""), String(item.state)));
        if (opts.qty !== false && item.quantity != null) row.appendChild(el("div", "qty", t("qty", { n: item.quantity })));
        if (opts.check) row.appendChild(el("span", "check" + (opts.check === "radio" ? " radio" : ""), ""));
        return row;
      }

      // Carte sélectionnable (case à cocher ou bouton radio)
      function selectableCard(item, selected, onToggle, opts) {
        var card = el("div", "card selectable" + (selected ? " selected" : ""));
        card.setAttribute("role", opts && opts.check === "radio" ? "radio" : "checkbox");
        card.setAttribute("aria-checked", String(!!selected));
        card.tabIndex = 0;
        card.appendChild(renderItem(item, opts));
        card.addEventListener("click", onToggle);
        card.addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); onToggle(); } });
        return card;
      }

      function infoBanner(text, success) {
        var b = el("div", "info-banner" + (success ? " success" : ""));
        b.appendChild(icon("icon-i"));
        b.appendChild(el("div", null, text));
        return b;
      }

      function errorCard(order) {
        var card = el("section", "order error");
        var header = el("div", "order-header");
        header.appendChild(icon("icon-info"));
        var txt = el("div");
        txt.appendChild(el("div", "order-title", order.id ? t("order.title", { id: order.id }) : t("order.error")));
        txt.appendChild(el("div", "order-sub", t("order.load_failed", { error: order.error })));
        header.appendChild(txt);
        card.appendChild(header);
        return card;
      }

      // ---------- Parcours de substitution ----------

      var wizard = { step: 0, orders: [], selected: {}, replacements: {}, candidates: {}, results: {} };

      function allItems() {
        return wizard.orders.reduce(function (acc, o) { return acc.concat(o.items || []); }, []);
      }
      function selectedItems() {
        return allItems().filter(function (it) { return wizard.selected[it.key]; });
      }

      function goTo(step) {
        wizard.step = step;
        if (step === 1) loadCandidates();
        render();
        window.scrollTo(0, 0);
      }

      function renderStepper() {
        Array.prototype.forEach.call(document.querySelectorAll("#stepper .step"), function (node) {
          var n = Number(node.getAttribute("data-step"));
          node.className = "step" + (n === wizard.step ? " active" : n < wizard.step ? " done" : "");
        });
      }

      function renderFooter() {
        var back = document.getElementById("back");
        var next = document.getElementById("next");
        var hasItems = allItems().length > 0;
        back.hidden = wizard.step === 0 || wizard.validated;
        next.hidden = !hasItems || wizard.validated;
        if (wizard.step === 0) {
          next.textContent = t("btn.next");
          next.disabled = selectedItems().length === 0;
        } else if (wizard.step === 1) {
          next.textContent = t("btn.next");
          next.disabled = selectedItems().some(function (it) { return !wizard.replacements[it.key]; });
        } else {
          next.textContent = t("btn.validate");
          next.disabled = false;
        }
      }

      function isEligible(item) {
        return SUBSTITUTION_STATES.indexOf("*") >= 0 || SUBSTITUTION_STATES.indexOf(String(item.state)) >= 0;
      }

      // Carte non sélectionnable (statut ne permettant pas la substitution)
      function disabledCard(item) {
        var card = el("div", "card disabled");
        card.setAttribute("aria-disabled", "true");
        card.appendChild(renderItem(item));
        card.appendChild(el("div", "reason", t("items.not_eligible", { state: item.state })));
        return card;
      }

      // Étape 1 : sélection des articles à substituer
      function renderStepItems(box) {
        var errors = wizard.orders.filter(function (o) { return o.error; });
        errors.forEach(function (o) { box.appendChild(errorCard(o)); });
        var orders = wizard.orders.filter(function (o) { return !o.error; });
        if (!orders.length) return;
        box.appendChild(infoBanner(t("items.select")));
        orders.forEach(function (order) {
          if (orders.length > 1) box.appendChild(el("div", "group-title", t("order.title", { id: order.id })));
          var list = el("div", "list");
          if (!order.items.length) list.appendChild(el("div", "empty", t("items.none")));
          order.items.forEach(function (item) {
            if (!isEligible(item)) { list.appendChild(disabledCard(item)); return; }
            list.appendChild(selectableCard(item, wizard.selected[item.key], function () {
              if (wizard.selected[item.key]) { delete wizard.selected[item.key]; delete wizard.replacements[item.key]; }
              else wizard.selected[item.key] = true;
              render();
            }, { check: "checkbox" }));
          });
          box.appendChild(list);
        });
      }

      // Charge les fiches des articles de substitution de tous les articles sélectionnés
      function loadCandidates() {
        var items = selectedItems().filter(function (it) { return !wizard.candidates[it.key]; });
        if (!items.length) return;
        var ids = items.reduce(function (acc, it) { return acc.concat(it.substitutes); }, []);
        items.forEach(function (it) { wizard.candidates[it.key] = { loading: ids.length > 0, items: [] }; });
        if (!ids.length) return;
        fetchItemSheets(ids).then(function (sheets) {
          items.forEach(function (it) {
            wizard.candidates[it.key] = {
              items: it.substitutes.filter(function (id) { return sheets[id]; })
                .map(function (id) { return sheetToItem(id, sheets[id], it.currency); }),
              missing: it.substitutes.filter(function (id) { return !sheets[id]; })
            };
          });
        }).catch(function (e) {
          items.forEach(function (it) { wizard.candidates[it.key] = { items: [], error: e.message }; });
        }).then(render);
      }

      // Recherche d'un article d'échange : par nom (pattern) et par référence exacte
      function searchItems(item, query) {
        query = query.trim();
        if (!query) return;
        wizard.results[item.key] = { loading: true, query: query, items: [] };
        render();
        var byName = onestock(ITEMS_API, {
          pattern: query,
          searchable_fields: [{ name: "name", priority: 1 }],
          lang: lang,
          get_total: false,
          pagination: { start: 0, limit: SEARCH_LIMIT }
        }).then(function (d) { return (d && d.items) || []; });
        var byId = onestock(ITEMS_API, { item_ids: [query], get_total: false, pagination: { start: 0, limit: 1 } })
          .then(function (d) { return (d && d.items) || []; }, function () { return []; });
        Promise.all([byId, byName]).then(function (r) {
          var seen = {};
          var found = r[0].concat(r[1]).filter(function (x) {
            if (!x || seen[x.id] || x.id === item.item_id) return false;
            seen[x.id] = true;
            return true;
          });
          // La recherche ne renvoie que la langue demandée : on recharge les fiches dans toutes les langues
          // pour compléter les champs vides (descriptif, image) avec la langue de repli (fr)
          var ids = found.map(function (x) { return x.id; });
          return fetchItemSheets(ids).catch(function () { return {}; }).then(function (sheets) {
            wizard.results[item.key] = { query: query, items: found.map(function (x) {
              var byLang = Object.assign({}, x.features || {}, sheets[x.id] || {});
              return sheetToItem(x.id, byLang, item.currency);
            }) };
          });
        }).catch(function (e) {
          wizard.results[item.key] = { query: query, items: [], error: e.message };
        }).then(render);
      }

      function candidateList(item, candidates) {
        var list = el("div", "list");
        candidates.forEach(function (c) {
          var current = wizard.replacements[item.key];
          list.appendChild(selectableCard(c, current && current.item_id === c.item_id, function () {
            wizard.replacements[item.key] = c;
            render();
          }, { check: "radio", badge: false, qty: false }));
        });
        return list;
      }

      // Étape 2 : choix d'un article de substitution pour chaque article sélectionné
      function renderStepSubstitution(box) {
        box.appendChild(infoBanner(t("subst.intro")));
        selectedItems().forEach(function (item) {
          var block = el("section", "subst");
          var original = el("div", "card original");
          original.appendChild(renderItem(item));
          block.appendChild(original);

          var cand = wizard.candidates[item.key] || { items: [] };
          block.appendChild(el("div", "label", t("subst.label")));
          if (cand.loading) block.appendChild(el("div", "note", t("subst.loading")));
          else if (cand.error) block.appendChild(el("div", "note", t("error.prefix", { error: cand.error })));
          else if (!cand.items.length) block.appendChild(el("div", "note", t("subst.none")));
          else block.appendChild(candidateList(item, cand.items));
          if (cand.missing && cand.missing.length) block.appendChild(el("div", "note", t("subst.missing", { ids: cand.missing.join(", ") })));

          block.appendChild(el("div", "label", t("search.label")));
          var form = el("form", "search");
          var input = el("input");
          input.type = "search";
          input.placeholder = t("search.placeholder");
          var res = wizard.results[item.key];
          if (res) input.value = res.query;
          var btn = el("button", null, t("btn.search"));
          btn.type = "submit";
          form.appendChild(input);
          form.appendChild(btn);
          form.addEventListener("submit", function (e) { e.preventDefault(); searchItems(item, input.value); });
          block.appendChild(form);
          if (res) {
            if (res.loading) block.appendChild(el("div", "note", t("search.loading")));
            else if (res.error) block.appendChild(el("div", "note", t("error.prefix", { error: res.error })));
            else if (!res.items.length) block.appendChild(el("div", "note", t("search.none", { query: res.query })));
            else block.appendChild(candidateList(item, res.items));
          }
          box.appendChild(block);
        });
      }

      // Étape 3 : récapitulatif
      function renderStepValidation(box) {
        box.appendChild(infoBanner(wizard.validated
          ? t("valid.done", { n: selectedItems().length })
          : t("valid.check"), wizard.validated));
        selectedItems().forEach(function (item) {
          var row = el("div", "recap");
          var from = el("div", "card");
          from.appendChild(renderItem(item, { badge: false }));
          var to = el("div", "card selected");
          var repl = Object.assign({}, wizard.replacements[item.key], { quantity: item.quantity });
          to.appendChild(renderItem(repl, { badge: false }));
          row.appendChild(from);
          row.appendChild(el("div", "arrow", "↓"));
          row.appendChild(to);
          box.appendChild(row);
        });
      }

      // Résultat de la substitution (transmis à la page parente OneStock)
      function substitutionRequest() {
        return selectedItems().map(function (item) {
          var r = wizard.replacements[item.key];
          return {
            order_id: item.order_id,
            line_item_group_id: item.line_item_group_id,
            item_id: item.item_id,
            quantity: item.quantity,
            substitute_item_id: r.item_id
          };
        });
      }

      function render() {
        var box = document.getElementById("orders");
        box.innerHTML = "";
        document.getElementById("stepper").hidden = !allItems().length;
        renderStepper();
        if (wizard.step === 0) renderStepItems(box);
        else if (wizard.step === 1) renderStepSubstitution(box);
        else renderStepValidation(box);
        renderFooter();
        resize();
      }

      document.getElementById("back").addEventListener("click", function () { goTo(Math.max(0, wizard.step - 1)); });
      document.getElementById("next").addEventListener("click", function () {
        if (wizard.step < 2) return goTo(wizard.step + 1);
        wizard.validated = true;
        window.parent.postMessage({ type: "substitution_validated", substitutions: substitutionRequest() }, "*");
        render();
      });

      // ---------- Communication avec OneStock (iframe) ----------

      function resize() {
        window.parent.postMessage({ type: "extension_resize", height: document.documentElement.scrollHeight }, "*");
      }

      window.addEventListener("message", function (event) {
        if (allowedOrigin && event.origin !== allowedOrigin) return;
        if (!event.data || typeof event.data !== "object" || event.data.type !== "onestock_data") return;
        shared = event.data.data || {};
        // Numéro de commande : order_id (une commande), ou order_ids (plusieurs, séparées par des virgules)
        var raw = shared.order_id || shared.order_ids || params.get("order_id") || params.get("order_ids");
        orderIds = (Array.isArray(raw) ? raw : String(raw || "").split(",")).map(function (s) { return String(s).trim(); }).filter(Boolean);
        // Langue par défaut du site, puis chargement des articles
        get("api/settings", {}).then(function (cfg) {
          if (cfg && cfg.default_lang) FALLBACK_LANG = cfg.default_lang;
          if (cfg && Array.isArray(cfg.substitution_states)) SUBSTITUTION_STATES = cfg.substitution_states;
        }, function () {}).then(loadItems);
      });

      document.getElementById("close").addEventListener("click", function () {
        window.parent.postMessage({ type: "extension_close" }, "*");
      });

      window.parent.postMessage({ type: "extension_ready" }, "*");
    })();
  </script>
</body>
</html>
